name: Test Vanilla Image

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - 'vanilla/**'

jobs:
  test:
    name: Test ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm/v7, linux/arm64]
        include:
          - platform: linux/amd64
            tag: vanilla-amd64
            scope: amd64
          - platform: linux/arm/v7
            tag: vanilla-armv7
            scope: armv7
          - platform: linux/arm64
            tag: vanilla-arm64
            scope: arm64

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build image for ${{ matrix.platform }}
      uses: docker/build-push-action@v6
      with:
        context: ./vanilla
        file: vanilla/Dockerfile
        platforms: ${{ matrix.platform }}
        push: false
        load: true
        tags: |
          terraria-server:${{ matrix.tag }}
        cache-from: type=gha,scope=${{ matrix.scope }}
        cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

    - name: Test ${{ matrix.platform }}
      run: |
        echo "Testing platform: ${{ matrix.platform }}"

        # Start container
        container_id=$(docker run -d --platform=${{ matrix.platform }} -p 7777:7777 -e TEST_MODE=true terraria-server:${{ matrix.tag }})

        # Wait for server to start
        timeout=300
        started=false

        for ((i=0; i<$timeout; i++)); do
          if docker logs $container_id 2>&1 | grep -q "Listening on port 7777"; then
            started=true
            break
          fi
          sleep 1
        done

        if [ "$started" = false ]; then
          echo "Server failed to start for ${{ matrix.platform }}"
          docker logs $container_id
          docker stop $container_id
          docker rm $container_id
          exit 1
        fi

        # Test Terraria protocol
        success=false
        for attempt in {1..3}; do
          echo "Protocol test attempt $attempt..."
          response=$(echo -ne '\x04\x00\x01\x00' | nc -w 5 localhost 7777)
          echo "Server response: $response"
          if echo "$response" | grep -q "Multiplayer"; then
            success=true
            break
          fi
          sleep 1
        done

        # Cleanup
        docker stop $container_id
        docker rm $container_id

        if [ "$success" = false ]; then
          echo "Protocol test failed for ${{ matrix.platform }}"
          exit 1
        fi

        echo "Platform ${{ matrix.platform }} passed tests"